name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.CROSS_REPO_PAT != '' && 'beckhamz777/cb' || github.repository }}
          token: ${{ secrets.CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}
          tag_name: v2.2
          name: Release v2.2
          draft: false
          prerelease: false
          files: output/*.msi
          overwrite_files: true
