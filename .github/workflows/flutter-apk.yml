name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.CROSS_REPO_PAT || secrets.GITHUB_TOKEN }}

      # 2. Set up Java 17 (required by Android Gradle) with Caching
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # 3. Set up Flutter with Caching
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Create google-services.json dynamically for Android build
      - name: Create google-services.json
        run: |
          mkdir -p mobile_app/android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > mobile_app/android/app/google-services.json
          else
            cat << 'EOF' > mobile_app/android/app/google-services.json
{
  "project_info": {
    "project_number": "770719873707",
    "project_id": "checkbook-cc7d7",
    "storage_bucket": "checkbook-cc7d7.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:770719873707:android:200ff47cfd2d0d2cb055ee",
        "android_client_info": {
          "package_name": "com.example.mobile_app"
        }
      },
      "oauth_client": [],
      "api_key": [
        {
          "current_key": "AIzaSyDkpegrDv-ggJv4_inRXSk3aAKY6qz6n6A"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": []
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi

      # 5. Get dependencies
      - name: Get Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      # 5. Build APK (Shorebird if token exists, standard Flutter fallback if not)
      - name: Build APK
        working-directory: mobile_app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD }}
        run: |
          if [ -n "$SHOREBIRD_TOKEN" ]; then
            echo "Installing Shorebird CLI..."
            curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh | sh || true
            export PATH="$HOME/.shorebird/bin:$PATH"
            if command -v shorebird >/dev/null 2>&1; then
              shorebird release android --artifact=apk --build-name=2.2.0 --build-number=${{ github.run_number }}
            else
              echo "Shorebird CLI installation unavailable, building standard Flutter APK..."
              flutter build apk --release --build-name=2.2.0 --build-number=${{ github.run_number }}
            fi
          else
            echo "SHOREBIRD_TOKEN not found, building standard Flutter APK..."
            flutter build apk --release --build-name=2.2.0 --build-number=${{ github.run_number }}
          fi

      # 6. Rename APK
      - name: Rename APK
        working-directory: mobile_app
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          find build/app/outputs -name "*.apk" -exec cp {} build/app/outputs/flutter-apk/CheckBook.apk \;

      # 7. Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v2.2.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Release v2.2.{0}', github.run_number) }}
          draft: false
          prerelease: false
          files: |
            mobile_app/build/app/outputs/flutter-apk/CheckBook.apk
          overwrite_files: true

      # 8. Register Release in Supabase app_releases table
      - name: Register Release in Supabase
        run: |
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || format('v2.2.{0}', github.run_number) }}"
          curl -X POST "https://jhucvkqwenhyiveqsmtf.supabase.co/rest/v1/app_releases" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpodWN2a3F3ZW5oeWl2ZXFzbXRmIiwicm9sZCI6ImFub24iLCJpYXQiOjE3Njk5NzI5MjIsImV4cCI6MjA4NTU0ODkyMn0.yXju47Ly5ak8Gm4D0OI42O89qTsc0nYtkmAb7dGFCC8" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpodWN2a3F3ZW5oeWl2ZXFzbXRmIiwicm9sZCI6ImFub24iLCJpYXQiOjE3Njk5NzI5MjIsImV4cCI6MjA4NTU0ODkyMn0.yXju47Ly5ak8Gm4D0OI42O89qTsc0nYtkmAb7dGFCC8" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"platform\": \"android\",
              \"version\": \"2.2.0+${{ github.run_number }}\",
              \"download_url\": \"https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/CheckBook.apk\",
              \"mandatory\": false,
              \"release_notes\": \"Automated Android Build 2.2.0+${{ github.run_number }}\"
            }"


