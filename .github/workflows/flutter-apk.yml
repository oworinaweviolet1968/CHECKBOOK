name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required by Android Gradle)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Set up Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: 'stable'

      # 4. Get dependencies
      - name: Get Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      # 5. Build APK (release mode with release signing and dynamic build number)
      - name: Build APK
        working-directory: mobile_app
        run: flutter build apk --release --build-name=2.1.0 --build-number=${{ github.run_number }}
        
      # 6. Rename APK
      - name: Rename APK
        working-directory: mobile_app
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/CheckBook.apk

      # 7. Release to beckhamz777/cb repository
      - name: Create Release in cb repository
        uses: softprops/action-gh-release@v2
        with:
          repository: beckhamz777/cb
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v2.1
          name: Release v2.1
          draft: false
          prerelease: false
          files: |
            mobile_app/build/app/outputs/flutter-apk/CheckBook.apk
