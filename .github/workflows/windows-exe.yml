name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. Download JavaFX SDK
      - name: Download JavaFX SDK
        run: |
          Invoke-WebRequest -Uri https://download2.gluonhq.com/openjfx/21.0.10/openjfx-21.0.10_windows-x64_bin-sdk.zip -OutFile javafx-sdk.zip
          Expand-Archive javafx-sdk.zip -DestinationPath javafx-sdk

      # 4. Build the Maven project
      - name: Build Maven project
        run: mvn clean package

      # 5. Prepare dist directory with only the shaded JAR
      - name: Prepare dist directory
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/ManagementSYS-1.8.jar dist/

      # 6. Extract icon from resources for jpackage
      - name: Extract application icon
        run: |
          jar xf dist/ManagementSYS-1.8.jar com/meto/inventory/views/images/app_icon.ico
          Copy-Item com/meto/inventory/views/images/app_icon.ico app_icon.ico

      # 7. Create Windows MSI using jpackage
      - name: Create Windows MSI
        run: |
          jpackage `
            --type msi `
            --name METO.IMS `
            --app-version 1.8 `
            --dest output `
            --input dist `
            --main-jar ManagementSYS-1.8.jar `
            --main-class com.meto.inventory.AppLauncher `
            --module-path javafx-sdk/javafx-sdk-21.0.10/lib `
            --add-modules javafx.controls,javafx.fxml,javafx.web,javafx.media,javafx.graphics,javafx.base,java.sql,java.naming,java.desktop,java.management,jdk.crypto.ec,java.prefs,java.net.http,java.xml,java.logging,jdk.unsupported `
            --java-options "--add-modules=javafx.controls,javafx.fxml,javafx.web,javafx.media,javafx.graphics,javafx.base" `
            --icon app_icon.ico `
            --vendor "METO" `
            --description "METO Inventory Management System" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      # 8. Release to beckhamz777/cb repository
      - name: Create Release in cb repository
        uses: softprops/action-gh-release@v2
        with:
          repository: beckhamz777/cb
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v1.8
          name: Release v1.8
          draft: false
          prerelease: false
          files: |
            output/*.msi
