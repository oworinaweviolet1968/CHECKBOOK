name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. Download JavaFX SDK
      - name: Download JavaFX SDK
        run: |
          Invoke-WebRequest -Uri https://download2.gluonhq.com/openjfx/21.0.10/openjfx-21.0.10_windows-x64_bin-sdk.zip -OutFile javafx-sdk.zip
          Expand-Archive javafx-sdk.zip -DestinationPath javafx-sdk

      # 4. Build the Maven project
      - name: Build Maven project
        run: mvn clean package

      # 5. Prepare dist directory with only the shaded JAR
      - name: Prepare dist directory
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/ManagementSYS-1.0-SNAPSHOT.jar dist/

      # 6. Extract icon from resources for jpackage
      - name: Extract application icon
        run: |
          jar xf dist/ManagementSYS-1.0-SNAPSHOT.jar com/meto/inventory/views/images/app_icon.ico
          Copy-Item com/meto/inventory/views/images/app_icon.ico app_icon.ico

      # 7. Create Windows MSI using jpackage
      - name: Create Windows MSI
        run: |
          jpackage `
            --type msi `
            --name METO.IMS `
            --app-version 1.8 `
            --dest output `
            --input dist `
            --main-jar ManagementSYS-1.0-SNAPSHOT.jar `
            --main-class com.meto.inventory.AppLauncher `
            --module-path javafx-sdk/javafx-sdk-21.0.10/lib `
            --add-modules javafx.controls,javafx.fxml,javafx.web,javafx.media `
            --icon app_icon.ico `
            --vendor "METO" `
            --description "METO Inventory Management System" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      # 8. Upload the MSI as an artifact
      - name: Upload MSI artifact
        uses: actions/upload-artifact@v5
        with:
          name: METO.IMS-MSI
          path: output/*.msi
