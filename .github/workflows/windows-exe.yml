name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # 3. Build the Maven project
      - name: Build Maven project
        run: mvn clean package -q

      # 4. Prepare dist directory with only the shaded JAR
      - name: Prepare dist directory
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/ManagementSYS-1.8.jar dist/

      # 5. Extract logo.png from JAR and convert to .ico for jpackage using ImageMagick
      - name: Extract and convert logo to ICO
        run: |
          jar xf dist/ManagementSYS-1.8.jar com/meto/inventory/views/images/logo.png
          magick convert com/meto/inventory/views/images/logo.png -define icon:auto-resize=256,128,64,32,16 app_icon.ico
          Write-Host "app_icon.ico created perfectly from logo.png using ImageMagick"

      # 6. Create Windows MSI using generic JRE (no JavaFX module conflicts)
      - name: Create Windows MSI
        run: |
          jpackage `
            --type msi `
            --name "METO.IMS" `
            --app-version 1.8 `
            --dest output `
            --input dist `
            --main-jar ManagementSYS-1.8.jar `
            --main-class com.meto.inventory.AppLauncher `
            --add-modules java.base,java.desktop,java.sql,java.net.http,java.xml,java.prefs,java.management,jdk.crypto.ec,jdk.unsupported,java.scripting,java.rmi `
            --icon app_icon.ico `
            --vendor "METO" `
            --description "METO Inventory Management System" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      # 7. Release MSI to beckhamz777/cb repository
      - name: Create Release in cb repository
        uses: softprops/action-gh-release@v2
        with:
          repository: beckhamz777/cb
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v1.8
          name: Release v1.8
          draft: false
          prerelease: false
          files: |
            output/*.msi
