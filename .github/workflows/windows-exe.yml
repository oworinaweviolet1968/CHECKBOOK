name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 3. Inject Version & Build Maven project
      - name: Inject Version & Build Maven project
        shell: powershell
        run: |
          $ver = "2.2.${{ github.run_number }}"
          (Get-Content src/main/java/com/meto/inventory/services/AutoUpdater.java) -replace 'public static final String CURRENT_VERSION = ".*";', "public static final String CURRENT_VERSION = `"$ver`";" | Set-Content src/main/java/com/meto/inventory/services/AutoUpdater.java
          mvn clean package -q


      # 4. Prepare dist directory with only the shaded JAR
      - name: Prepare dist directory
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item target/ManagementSYS-2.2.jar dist/

      # 5. Extract logo.png from JAR and convert to .ico for jpackage using ImageMagick
      - name: Extract and convert logo to ICO
        run: |
          jar xf dist/ManagementSYS-2.2.jar com/meto/inventory/views/images/logo.png
          magick convert com/meto/inventory/views/images/logo.png -define icon:auto-resize=256,128,64,32,16 app_icon.ico
          Write-Host "app_icon.ico created perfectly from logo.png using ImageMagick"

      # 6. Create Windows MSI using generic JRE (no JavaFX module conflicts)
      - name: Create Windows MSI
        run: |
          jpackage `
            --type msi `
            --name "CHECKBOOK IMS" `
            --app-version 2.2.${{ github.run_number }} `
            --win-upgrade-uuid 38e83dd9-5692-4035-90af-56b8c3d149b5 `
            --dest output `
            --input dist `
            --main-jar ManagementSYS-2.2.jar `
            --main-class com.meto.inventory.AppLauncher `
            --add-modules java.base,java.desktop,java.sql,java.net.http,java.xml,java.prefs,java.management,jdk.crypto.ec,jdk.unsupported,java.scripting,java.rmi `
            --icon app_icon.ico `
            --vendor "CHECKBOOK" `
            --description "CHECKBOOK Inventory Management System" `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      # 6.5 Rename MSI to a consistent filename
      - name: Rename MSI
        run: |
          Get-ChildItem -Path output -Filter *.msi | Rename-Item -NewName "CHECKBOOK.IMS.msi"


      # 7. Release MSI to beckhamz777/cb repository
      - name: Create Release in cb repository
        uses: softprops/action-gh-release@v2
        with:
          repository: beckhamz777/cb
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v2.2
          name: Release v2.2
          draft: false
          prerelease: false
          files: |
            output/*.msi

      # 8. Register Release in Supabase app_releases table
      - name: Register Release in Supabase
        shell: powershell
        run: |
          $body = @{
              platform = "desktop"
              version = "2.2.${{ github.run_number }}"
              download_url = "https://github.com/beckhamz777/cb/releases/download/v2.2/CHECKBOOK.IMS.msi"
              mandatory = $false
              release_notes = "Automated Windows Desktop Build 2.2.${{ github.run_number }}"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri "https://jhucvkqwenhyiveqsmtf.supabase.co/rest/v1/app_releases" `
            -Method Post `
            -Headers @{
                "apikey" = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpodWN2a3F3ZW5oeWl2ZXFzbXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NzI5MjIsImV4cCI6MjA4NTU0ODkyMn0.yXju47Ly5ak8Gm4D0OI42O89qTsc0nYtkmAb7dGFCC8"
                "Authorization" = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpodWN2a3F3ZW5oeWl2ZXFzbXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NzI5MjIsImV4cCI6MjA4NTU0ODkyMn0.yXju47Ly5ak8Gm4D0OI42O89qTsc0nYtkmAb7dGFCC8"
                "Content-Type" = "application/json"
                "Prefer" = "return=minimal"
            } `
            -Body $body

