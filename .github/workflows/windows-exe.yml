name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # 3. Download JavaFX SDK
      - name: Download JavaFX SDK
        run: |
          Invoke-WebRequest -Uri https://gluonhq.com/download/javafx-21-0-9-sdk/windows/javafx-sdk-21.0.9.zip -OutFile javafx-sdk.zip
          Expand-Archive javafx-sdk.zip -DestinationPath javafx-sdk

      # 4. Build the Maven project
      - name: Build Maven project
        run: mvn clean package

      # 5. Create Windows EXE using jpackage
      - name: Create Windows EXE
        run: |
          jpackage `
            --type exe `
            --name ManagementSYS `
            --input target `
            --main-jar ManagementSYS-1.0-SNAPSHOT.jar `
            --main-class com.meto.inventory.Main `
            --module-path javafx-sdk/javafx-sdk-21.0.9/lib `
            --add-modules javafx.controls,javafx.fxml `
            --win-dir-chooser `
            --win-menu `
            --win-shortcut

      # 6. Upload the EXE as an artifact
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v3
        with:
          name: ManagementSYS-EXE
          path: ManagementSYS.exe
