name: Build Flutter IPA (iOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3. Get Flutter dependencies
      - name: Get Flutter dependencies
        working-directory: mobile_app
        run: flutter pub get

      # 4. Build unsigned IPA (xtool will re-sign on device)
      - name: Build IPA (unsigned)
        working-directory: mobile_app
        run: |
          flutter build ipa \
            --release \
            --build-name=2.2.0 \
            --build-number=${{ github.run_number }} \
            --no-codesign

      # 5. Locate and rename IPA
      - name: Locate and rename IPA
        working-directory: mobile_app
        run: |
          mkdir -p build/ios/ipa
          IPA_PATH=$(find build/ios -name "*.ipa" 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            # Package .app into IPA from archive or build directory
            APP_PATH=$(find build/ios -name "*.app" -type d 2>/dev/null | head -1)
            if [ -n "$APP_PATH" ]; then
              echo "Found app bundle at: $APP_PATH"
              rm -rf build/ios/ipa/Payload
              mkdir -p build/ios/ipa/Payload
              cp -R "$APP_PATH" build/ios/ipa/Payload/
              cd build/ios/ipa
              zip -qr CheckBook.ipa Payload
              rm -rf Payload
              cd -
              echo "Successfully packaged CheckBook.ipa from .app"
            else
              echo "ERROR: No .ipa or .app found!"
              find build/ios -type f | head -30
              exit 1
            fi
          else
            echo "Found existing IPA at: $IPA_PATH"
            cp "$IPA_PATH" build/ios/ipa/CheckBook.ipa
          fi
          ls -lh build/ios/ipa/


      # 6. Upload IPA as workflow artifact (available for 30 days)
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckBook-iOS-${{ github.run_number }}
          path: mobile_app/build/ios/ipa/CheckBook.ipa
          retention-days: 30

      # 7. Create GitHub Release with IPA
      - name: Create iOS Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "v2.2.${{ github.run_number }}-ios"
          name: "iOS Release v2.2.${{ github.run_number }}"
          draft: false
          prerelease: true
          files: |
            mobile_app/build/ios/ipa/CheckBook.ipa
