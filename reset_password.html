<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Inventory System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --text-color: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: var(--bg-gradient);
            color: var(--text-color);
        }

        .container {
            background: var(--glass-bg);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease-out;
        }

        h2 {
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #111827;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.2s;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 1.5rem;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
        }

        .message-error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message-success {
            background-color: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .hidden {
            display: none !important;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Reset Password</h2>
        <div id="reset-form">
            <p>Enter your new password below to secure your account.</p>

            <div class="input-group">
                <label for="password">New Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="••••••••" required>
            </div>

            <button onclick="updatePassword()" id="update-btn">Update Password</button>
        </div>
        <div id="message"></div>
    </div>

    <script>
        // Initialize Supabase Client
        const supabaseUrl = 'https://jhucvkqwenhyiveqsmtf.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpodWN2a3F3ZW5oeWl2ZXFzbXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5NzI5MjIsImV4cCI6MjA4NTU0ODkyMn0.yXju47Ly5ak8Gm4D0OI42O89qTsc0nYtkmAb7dGFCC8'
        // FIX: Rename variable to avoid conflict with global 'supabase' from CDN
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey)

        let sessionInitialized = false;

        // Better Session Detection
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            console.log("Auth Event:", event);
            if (event === "PASSWORD_RECOVERY" || event === "SIGNED_IN") {
                sessionInitialized = true;
                console.log("Session active for:", session.user.email);
            }
        });

        // Backup check if onAuthStateChange doesn't fire (sometimes happens on page load)
        setTimeout(async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                sessionInitialized = true;
                console.log("Session found via getSession");
            } else {
                // Check URL hash fallback
                const hash = window.location.hash;
                if (hash && hash.includes("type=recovery")) {
                    console.log("Recovery hash found, waiting for Supabase to process...");
                } else {
                    console.log("No session or recovery token found.");
                }
            }
        }, 1000); // Give it a full second

        async function updatePassword() {
            // DEBUG: Immediate alert to prove function is called
            // alert("Debug: Function called!"); 

            try {
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirm-password').value;
                const btn = document.getElementById('update-btn');

                // Validation
                if (!password) {
                    alert("Please enter a new password.");
                    return;
                }
                if (password.length < 6) {
                    alert("Password must be at least 6 characters long.");
                    return;
                }
                if (password !== confirmPassword) {
                    alert("Passwords do not match.");
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Updating...';

                // Ensure session exists
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) {
                    alert("Error: No active session. Please click the reset link in your email again.");
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                    return;
                }

                const { data, error } = await supabaseClient.auth.updateUser({
                    password: password
                })

                if (error) {
                    throw error;
                }

                if (data) {
                    showMessage("Password updated successfully! You can now close this page and login to the app.", "success");
                    document.getElementById('reset-form').classList.add('hidden');
                    alert("Success! Password updated.");
                }

            } catch (err) {
                console.error(err);
                alert("Error: " + err.message);
                const btn = document.getElementById('update-btn');
                btn.disabled = false;
                btn.innerText = "Update Password";
                showMessage(err.message, "error");
            }
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('message');
            if (!text) {
                msgEl.style.display = 'none';
                msgEl.className = '';
                return;
            }
            msgEl.innerText = text;
            msgEl.className = type === 'error' ? 'message-error' : 'message-success';
            msgEl.style.display = 'block';
        }
    </script>

</body>

</html>
